spring.config.import=optional:file:./application-mysql-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://routineslim-db-routineslim.k.aivencloud.com:22960/routineslim_web?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:routineslim}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-mysql.sql
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false